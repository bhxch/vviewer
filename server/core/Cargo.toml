[package]
name = "vviewer-core"
version = "0.1.0"
edition = "2021"
description = "vviewer 框架无关业务核：纯类型请求/响应 + 领域 handler（多端发布阶段二）"
license = "Apache-2.0"

# 依赖倒置方向（plan Global Constraints）：server → core 单向；core 不依赖
# axum/tower-http。http/bytes 为框架中立类型（axum 0.8 同源 http 1.x / bytes
# 1.x），适配层映射零转换成本。
#
# native feature（多端发布阶段二 Task 3，与适配层 vviewer 同名共识）：承载
# comrak/tree-sitter/layout-rs/svgbob 重依赖的 compute 域（markdown/highlight/
# diagrams）。默认开启（native 构建行为不变）；worker 形态
# `--no-default-features` 整域裁剪——compute 模块编译不存在、build.rs 跳过
# grammar 编译、health 不宣告 compute/diagrams。
# 阶段三 Task 1（终审 I-1）：native 同时转发 storage 的 native transport
# （reqwest）——裁剪形态 storage 以 default-features = false 进入，reqwest
# 全家不进 worker 依赖图；storage 本体（StorageBackend trait + LocalFs +
# S3/WebDAV + HttpTransport 接缝）恒在依赖图（挂载三 API 与 file/tree 经
# S3/WebDAV 是 worker 形态的保留能力，不随裁剪）。
[features]
default = ["native"]
native = [
    "dep:comrak",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-language",
    "dep:layout-rs",
    "dep:svgbob",
    "vviewer-storage/native",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
http = "1"
# guard 的 canonicalize + search 域子进程 IO/pump + events 驱动任务
# （process/io-util/sync/time/rt/macros；tokio 本体随 plan 允许入 core，
# 重依赖门控归 native feature）
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
# CoreBody::Stream 的 chunk 流 trait（futures-core 零运行时）与文件读流的
# AsyncRead→chunk 包装（ReaderStream）；SSE 流（Task 3）消费同形态
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# detect 的语言反查表（扩展名→语言，构建期内嵌清单）
once_cell = "1"
# 域 handler 结局观测（search pump 结局 debug 日志等；tracing 非 axum 依赖）
tracing = "0.1"
# ticket 签发的 32B 随机 hex（generate_token；自适配层迁入）
rand = "0.10"
# 存储抽象（StorageBackend trait + LocalFs + S3/WebDAV + HttpTransport 接缝）：
# core 的 roots/挂载容器数据面。default-features = false（阶段三 Task 1，终审
# I-1）：reqwest（storage native transport）仅经本 crate `native` feature 转发
# 进入——裁剪形态零 reqwest；运行时注册的 transport 缺省构造（native）与注入
# 形态见 state.rs。
vviewer-storage = { path = "../storage", default-features = false }
# ---- 以下为 native（compute 域）重依赖，随 feature 裁剪 ----
# 仅库渲染：禁默认（cli/syntect-onig 语法高亮用不到）；shortcodes 为 GFM emoji 短码
comrak = { version = "0.56.0", default-features = false, features = ["shortcodes"], optional = true }
# 服务端语法高亮：grammar 不走 crates.io crate，由 build.rs 按源码编译
#（grammars-manifest.json 清单 + tools/grammar-builder 产出的源树，见 build.rs）。
tree-sitter = { version = "0.27", optional = true }
tree-sitter-highlight = { version = "0.27", optional = true }
tree-sitter-language = { version = "0.1", optional = true }
# 服务端图表渲染（spec 2026-10-19 §2.5，markpad Rust 栈同款）
layout-rs = { version = "0.1", optional = true }
svgbob = { version = "0.7", optional = true }

[build-dependencies]
# 构建脚本本体恒编译（build-deps 不可随 feature 裁剪）；native 门控在脚本内
# （CARGO_FEATURE_NATIVE 检查）——worker 形态仅付出 cc/serde_json 构建脚本
# 编译成本（秒级），grammar 源码编译完全跳过。
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# 域 handler 锚测的异步运行时（#[tokio::test]）；test-util 供 highlight 504
# 超时锚测的 start_paused 挂钟暂停（随 compute 域测试迁入）
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
