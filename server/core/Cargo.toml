[package]
name = "vviewer-core"
version = "0.1.0"
edition = "2021"
description = "vviewer 框架无关业务核：纯类型请求/响应 + 领域 handler（多端发布阶段二）"
license = "Apache-2.0"

# 依赖倒置方向（plan Global Constraints）：server → core 单向；core 不依赖
# axum/tower-http/notify/comrak。http/bytes 为框架中立类型（axum 0.8 同源
# http 1.x / bytes 1.x），适配层映射零转换成本。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
http = "1"
# guard 的 canonicalize（tokio 本体随 plan 允许入 core；重依赖门控属后续任务）
tokio = { version = "1", features = ["fs"] }
# CoreBody::Stream 的 chunk 流 trait（futures-core 零运行时）与文件读流的
# AsyncRead→chunk 包装（ReaderStream）；SSE 流（Task 3）消费同形态
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# detect 的语言反查表（扩展名→语言，构建期内嵌清单）
once_cell = "1"
# 存储抽象（StorageBackend trait + LocalFs）：core 的 roots/挂载容器数据面
vviewer-storage = { path = "../storage" }

[dev-dependencies]
tempfile = "3"
# 域 handler 锚测的异步运行时（#[tokio::test]）
tokio = { version = "1", features = ["macros", "rt"] }
