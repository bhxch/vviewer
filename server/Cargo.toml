[package]
name = "vviewer"
version = "0.1.0"
edition = "2021"
description = "vviewer local file server (axum)"

[lib]
name = "vviewer"
path = "src/lib.rs"

[[bin]]
name = "vviewer"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
futures-core = "0.3"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
notify = "7"
once_cell = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
