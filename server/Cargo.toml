[package]
name = "vviewer"
version = "0.1.0"
edition = "2021"
description = "vviewer local file server (axum)"
license = "Apache-2.0"

[lib]
name = "vviewer"
path = "src/lib.rs"

[[bin]]
name = "vviewer"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4", features = ["derive"] }
# 仅库渲染：禁默认（cli/syntect-onig 语法高亮用不到）；shortcodes 为 GFM emoji 短码
comrak = { version = "0.56.0", default-features = false, features = ["shortcodes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
futures-core = "0.3"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
notify = "7"
once_cell = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# 服务端语法高亮（M6 Task 3）：tree-sitter-highlight + 核心 grammar 子集。
# grammar crate 暴露 tree-sitter-language::LanguageFn（LANGUAGE 常量），
# 经 tree_sitter::Language::from 转换后供 HighlightConfiguration 使用。
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
# start_paused（挂钟暂停）：高亮 504 超时测试的确定性触发
tokio = { version = "1", features = ["test-util"] }
