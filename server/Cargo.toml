[package]
name = "vviewer"
version = "0.1.0"
edition = "2021"
description = "vviewer local file server (axum)"
license = "Apache-2.0"

[lib]
name = "vviewer"
path = "src/lib.rs"

[[bin]]
name = "vviewer"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4", features = ["derive"] }
# 仅库渲染：禁默认（cli/syntect-onig 语法高亮用不到）；shortcodes 为 GFM emoji 短码
comrak = { version = "0.56.0", default-features = false, features = ["shortcodes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
futures-core = "0.3"
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "compression-gzip"] }
notify = "8"
once_cell = "1"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# 服务端语法高亮：grammar 不走 crates.io crate，由 build.rs 按源码编译
#（grammars-manifest.json 清单 + tools/grammar-builder 产出的源树，见 build.rs）。
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
# start_paused（挂钟暂停）：高亮 504 超时测试的确定性触发
tokio = { version = "1", features = ["test-util"] }
