[package]
name = "vviewer"
version = "0.1.0"
edition = "2021"
description = "vviewer local file server (axum)"
license = "Apache-2.0"

# server/ 为 workspace 根：主 crate + core（阶段二业务核）+ storage（目录挂载
# 阶段一存储抽象）+ worker（Workers 适配，阶段三）子 crate。
# 仓库无上层 workspace（repo 根无 Cargo.toml），单 lock 落在 server/Cargo.lock。
# worker 成员 native 构建（cargo test --workspace 回归面）：纯函数模块
# （Range/VV_MOUNTS 解析）host 可测，wasm-bindgen 面按 target 门控。
[workspace]
members = ["core", "storage", "worker"]

[lib]
name = "vviewer"
path = "src/lib.rs"

[[bin]]
name = "vviewer"
path = "src/main.rs"

# native feature（多端发布阶段二 Task 3，与 vviewer-core 同名共识）：watch
# （notify）与 compute（comrak/tree-sitter/diagrams——实现体在 core，经
# `vviewer-core/native` 转发）的门控总开关。默认开启（native 构建行为不变）；
# worker 形态 `--no-default-features`：watch.rs/compute 路由编译不存在、
# /api/events 不挂载（watch=false 能力缺失）、health 不宣告 compute/diagrams
# （core::health 同名 feature 协同门控）。
# 阶段三 Task 1（终审 I-1）：转发链补 storage 的 native transport——
# `vviewer-storage` 以 default-features = false 进入（reqwest 不随依赖边默认
# 携带），native 总开关显式转发 `vviewer-storage/native`。裁剪形态 workspace
# 全图零 reqwest（`cargo check --workspace --all-targets --no-default-features`
# 即实证锚）；native 形态解析结果与改动前逐包一致（Cargo.lock 零漂移）。
[features]
default = ["native"]
native = ["dep:notify", "dep:reqwest", "vviewer-core/native", "vviewer-storage/native"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --config TOML 全参配置文件（spec 2026-10-19 §2.1：CLI>文件、未知键报错）
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
futures-core = "0.3"
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "compression-gzip"] }
# root 变更监听（watch 域唯一重依赖，随 native feature 裁剪）
notify = { version = "8", optional = true }
# kroki 转发域 native 传输（routes/kroki.rs 的 ReqwestKrokiHttp，spec
# 2026-10-23 §8.2）：与 storage 同款门控纪律——reqwest 不随依赖边默认携带，
# native 总开关显式转发（dep:reqwest）；同版本 0.12 与 vviewer-storage/native
# 汇聚同一包（Cargo.lock 零漂移），裁剪形态 workspace 全图零 reqwest 不变。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# KrokiHttp 接缝的 dyn 兼容 impl 宏（core 同源 0.1；native 门控的
# ReqwestKrokiHttp 与集成测试 mock 消费）
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# 存储抽象子 crate（StorageBackend trait + LocalFs，目录挂载阶段一）。
# default-features = false（阶段三 Task 1，终审 I-1）：reqwest（native
# transport）仅经本 crate `native` feature 转发——静态挂载装配（main.rs）的
# 缺省构造随 native 门控，裁剪形态零 reqwest。
vviewer-storage = { path = "storage", default-features = false }
# 框架无关业务核（阶段二抽取）：handler 业务体所在，适配层单向依赖。
# default-features=false + native 转发：worker 形态随本 crate 一起裁剪 core
# 的 compute 域（重依赖不进构建图）。
vviewer-core = { path = "core", default-features = false }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
log = "0.4"
tracing-log = "0.2"
# start_paused（挂钟暂停）：高亮 504 超时测试的确定性触发
tokio = { version = "1", features = ["test-util"] }
