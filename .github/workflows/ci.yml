# 最小 CI（final review A2）：typecheck + vitest + web 构建 + cargo test + E2E。
# grammar wasm 不入库：单测/e2e 前经 composite action 生成最小语言集（tree-sitter-cli
# 自建，免 emcc；工具链/源树/产物三层缓存）。全量门禁触发链：tag → release.yml →
# workflow_call 复用 grammar.yml（I2 后其自身无 push 触发器）。
# E2E 依赖 Playwright 浏览器下载：用 actions/cache 按 lockfile 哈希缓存 ms-playwright 目录。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web（typecheck + 单测 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 版本读 package.json 的 packageManager 字段（pnpm@10）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # highlight 单测用真实 wasm（bash/html/css/javascript/typescript）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust
      - run: pnpm typecheck
      # C 项：生成扩展名物入库（运行时装配依赖）——与 languages.json 失同步即失败，防入库漂移
      - run: node tools/grammar-builder/gen-code-extensions.mjs --check
      # wasm-bindgen CLI 供给缓存（runner 不预装 CLI）：构建脚本自供给下载官方预编译
      # 二进制到 ~/.cache/svgbob/wasm-bindgen-cli（镜像 grammar 工具链 binaryen 的
      # 「预编译 + ~/.cache 缓存」形态），此处仅承载缓存；键按 crate Cargo.toml 失效，
      # wasm-bindgen 依赖升级即自动重取新 CLI
      - uses: actions/cache@v6
        with:
          path: ~/.cache/svgbob/wasm-bindgen-cli
          key: wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('packages/vviewer-render-diagram/tools/svgbob-wasm/Cargo.toml') }}
      # svgbob wasm 引擎产物不入库（spec §7）：单测（diagramEngines.test.ts 对 gen 产物
      # 真渲染，缺产物即 skip——gen 步前移到 vitest 之前保证 CI 真跑非 skip）与 web
      # build 前构建期生成。wasm32 target 经 dtolnay 一步安装；cargo 编译缓存按
      # Cargo.lock 失效（Swatinem）；wasm-opt 复用 setup-grammars 已缓存的 binaryen
      #（~/.cache/tree-sitter），缺则脚本自行降级
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vviewer-render-diagram/tools/svgbob-wasm
      - run: pnpm gen:svgbob-wasm
      - run: pnpm vitest run
      - run: pnpm --filter web build
      # spec §2.6 预算门禁：dist 图表引擎 chunk（diagram-engines-*.js）总量 ≤4MB，
      # 超限即失败——启用集取舍（减引擎回落 kroki）见 spec，门禁先行兜底
      - name: 图表 chunk 预算门禁
        run: node tools/diagram-budget.mjs
      # 第三方声明完整性辅助检查（warning-only，恒 exit 0；新依赖忘登记时在日志可见）
      - run: node tools/check-notices/check-notices.mjs

  rust:
    name: rust（cargo test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # 2026-10-24 rust job 二连败取证键：02:33 通过 run 保存的缓存之后每次恢复
          # 都在 cargo test 33s 内 fast-fail（保存者绿、恢复者红、失败不回写缓存），
          # 缓存投毒与镜像迁移两假设并存——bust 后冷构建二选一裁决；绿跑回写新缓存
          key: rust-ci-bust-20261024
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build.rs 需要测试涉及语言的 grammar 源（partial 构建即可跑测试）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust,java,go,c,cpp,tsx,yaml,toml
          fetch-only: 'true'
      # --workspace：server/ 为 workspace 根（vviewer + vviewer-storage），
      # 单包默认不含成员 crate 测试
      # clippy 门禁（台账 3-19）：基线清零后 -D warnings 防回升（先于 test 失败即停）
      - run: cargo clippy --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings
      # tee 全量留档 /tmp，控制台只留尾部防日志过长；pipefail 保 cargo 失败即步失败
      - name: cargo test（workspace 全量）
        run: |
          set -o pipefail
          cargo test --manifest-path server/Cargo.toml --workspace 2>&1 | tee /tmp/cargo-test.log | tail -n 40
      # 失败日志尾部落 job summary：run summary 页对公开仓匿名可读，是本仓唯一
      # 免凭证取证面（api logs/artifact 均需 auth）——2026-10-24 rust job 连续
      # 32s 级 fast-fail（保存者自身绿、恢复者必红）取证用；绿跑零输出零成本
      - name: cargo test 失败日志尾部落 summary
        if: failure()
        run: |
          {
            echo '## cargo test 失败尾部（最近 120 行）'
            echo '```'
            tail -n 120 /tmp/cargo-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e（Playwright chromium）
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright 浏览器缓存（chromium ~150MB，按 lockfile 哈希失效）
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # e2e 高亮断言依赖真实 wasm（m1 js / m2 ts+rs / m3 围栏 ts+bash）；
      # java 供 b-grammar-layers 分层链用例（同源缺失 → CDN 层兜底）的资产来源；
      # yaml 供 t-hl BUG-37 用例（yaml 外置 scanner 修复后需真 yaml wasm）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust,java,yaml
      # b-grammar-layers 用例要求构建期注入 CDN 层 base（mock CDN，不依赖外网）；
      # 与 spec 内 mock 的路由前缀严格一致（base 同时容纳 manifest.json 与 *.wasm）
      # wasm-bindgen CLI 供给缓存（同 web job：脚本自供给官方预编译二进制，此处仅承载缓存）
      - uses: actions/cache@v6
        with:
          path: ~/.cache/svgbob/wasm-bindgen-cli
          key: wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('packages/vviewer-render-diagram/tools/svgbob-wasm/Cargo.toml') }}
      # svgbob wasm 引擎产物不入库（spec §7）：web build 前构建期生成（接线形态与
      # web job 一致：dtolnay 装 wasm32 target + Swatinem cargo 缓存 + wasm-opt 沿
      # setup-grammars 缓存的 binaryen，缺则脚本自行降级）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vviewer-render-diagram/tools/svgbob-wasm
      - run: pnpm gen:svgbob-wasm
      - run: pnpm --filter web build
        env:
          VV_GRAMMAR_CDN: https://cdn.grammars.test/grammars/
      # m6 远程 rg 通道断言依赖 runner 提供 ripgrep（health searchEngine=rg）：新
      # runner 镜像不再预装（2026-10-14 CI 实证降级 grep），显式安装保通道真实
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # 多源渲染语料不入库（避免上游许可证问题）：e2e 前经下载脚本按 SOURCES 表拉取各上游
      # 仓固定 commit 的文件到 apps/web/e2e/fixtures/corpus/<source-id>/（幂等，失败清单记
      # manifest）；github.token 提升 API 限流（匿名 60 → 1000 req/h）
      - run: node tools/fetch-e2e-corpus.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # playwright.config 的 webServer 在 CI 下自行启动 vite preview（CI 环境变量内置）
      - run: pnpm --filter web exec playwright test
      # 失败用例 trace 取证（config 的 trace: retain-on-failure）：真实 fetch 时序
      # 类缺陷的远程复现证据（网络面板/DOM 快照），本地不落盘仅 CI 收集
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
