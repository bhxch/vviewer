# 最小 CI（final review A2）：lint + typecheck + vitest + web 构建 + cargo test + E2E。
# grammar wasm 不入库：单测/e2e 前经 composite action 生成最小语言集（tree-sitter-cli
# 自建，免 emcc；工具链/源树/产物三层缓存）。全量门禁触发链：tag → release.yml →
# workflow_call 复用 grammar.yml（I2 后其自身无 push 触发器）。
# E2E 依赖 Playwright 浏览器下载：用 actions/cache 按 lockfile 哈希缓存 ms-playwright 目录。
# E2E 分片（spec G）：e2e-prep 一次构建/语料/生成物/server 二进制 → 4 分片 artifact 共享
# （仓库树消费面 + 构建产物 + 预编译二进制三类「spec 进程直读面」均随 artifact 下发，
# 见 tools/check-e2e-surfaces.mjs 清单）→ e2e-report 聚合 HTML；workers=1 维持
# （2026-10-14 裁决）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web（typecheck + 单测 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 版本读 package.json 的 packageManager 字段（pnpm@10）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint 门禁置于最前（秒级成本，失败即 fast-fail）：不依赖 grammar/wasm 等生成物，
      # install 完即可跑
      - run: pnpm run lint
      # 发布链接线门禁（评审 critical ① 占位版本 + important ④ 子包数/scope 未注入）：
      # 子包数（release workflow 级 env）、包内默认层数与 scope、两个构建面的注入
      # 三处口径一致——纯文本比对，无生成物依赖，可置于早失败位。
      - run: node tools/check-release-wiring/check-release-wiring.mjs
      # highlight 单测用真实 wasm（bash/html/css/javascript/typescript）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust
      - run: pnpm typecheck
      # spec F §3.4 裁量：gen-code-extensions 的 CI --check 步退役——generated-extensions.ts
      # 已出库不入库（setup-grammars gen 步生成/缓存下发），门禁语义并入 gen 成功性
      # （产物不在 checkout 即 gen 未跑，消费端确定性报错；无入库漂移可防）
      # plan-3 foreign 批锁版纪律：@file-viewer/* 依赖须精确版本（无 ^/~ 范围）且与
      # pnpm-lock 解析一致，范围前缀或 lock 漂移即失败——外部渲染链升级只能显式独立 commit
      - run: node tools/check-foreign-deps.mjs --check
      # wasm-bindgen CLI 供给缓存（runner 不预装 CLI）：构建脚本自供给下载官方预编译
      # 二进制到 ~/.cache/svgbob/wasm-bindgen-cli（镜像 grammar 工具链 binaryen 的
      # 「预编译 + ~/.cache 缓存」形态），此处仅承载缓存；键按 crate Cargo.toml 失效，
      # wasm-bindgen 依赖升级即自动重取新 CLI
      - uses: actions/cache@v6
        with:
          path: ~/.cache/svgbob/wasm-bindgen-cli
          key: wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('packages/vviewer-render-diagram/tools/svgbob-wasm/Cargo.toml') }}
      # svgbob wasm 引擎产物不入库（spec §7）：单测（diagramEngines.test.ts 对 gen 产物
      # 真渲染，缺产物即 skip——gen 步前移到 vitest 之前保证 CI 真跑非 skip）与 web
      # build 前构建期生成。wasm32 target 经 dtolnay 一步安装；cargo 编译缓存按
      # Cargo.lock 失效（Swatinem）；wasm-opt 复用 setup-grammars 已缓存的 binaryen
      #（~/.cache/tree-sitter），缺则脚本自行降级
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vviewer-render-diagram/tools/svgbob-wasm
      - run: pnpm gen:svgbob-wasm
      - run: pnpm vitest run
      - run: pnpm --filter web build
      # spec §2.6 预算门禁：dist 图表引擎 chunk（diagram-engines-*.js）总量 ≤4MB，
      # 超限即失败——启用集取舍（减引擎回落 kroki）见 spec，门禁先行兜底
      - name: 图表 chunk 预算门禁
        run: node tools/diagram-budget.mjs
      # plan-3 foreign 预算门禁（spec §6.2 Task 4）：marker 断言只拦 external 化/import
      # 残留（@file-viewer 代码被打进非 foreign chunk 且包名被压缩消除时无 marker 可寻，
      # 该路径由 precache 断言 + foreign chunk 存在性断言闭合），另断言 precache 清单
      # 无 foreign-*.js / @file-viewer URL、dist 无 file-viewer 资产目录——不得放宽门禁
      - name: foreign 预算门禁
        run: node tools/foreign-budget.mjs --check
      # 第三方声明完整性辅助检查（warning-only，恒 exit 0；新依赖忘登记时在日志可见）
      - run: node tools/check-notices/check-notices.mjs

  rust:
    name: rust（cargo test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # 2026-10-24 rust job 二连败取证键：02:33 通过 run 保存的缓存之后每次恢复
          # 都在 cargo test 33s 内 fast-fail（保存者绿、恢复者红、失败不回写缓存），
          # 缓存投毒与镜像迁移两假设并存——bust 后冷构建二选一裁决；绿跑回写新缓存
          key: rust-ci-bust-20261024
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build.rs 需要测试涉及语言的 grammar 源（partial 构建即可跑测试）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust,java,go,c,cpp,tsx,yaml,toml
          fetch-only: 'true'
      # --workspace：server/ 为 workspace 根（vviewer + vviewer-storage），
      # 单包默认不含成员 crate 测试
      # clippy 门禁（台账 3-19）：基线清零后 -D warnings 防回升（先于 test 失败即停）
      - run: cargo clippy --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings
      # tee 全量留档 /tmp，控制台只留尾部防日志过长；pipefail 保 cargo 失败即步失败
      - name: cargo test（workspace 全量）
        run: |
          set -o pipefail
          cargo test --manifest-path server/Cargo.toml --workspace 2>&1 | tee /tmp/cargo-test.log | tail -n 40
      # 失败日志尾部落 job summary：run summary 页对公开仓匿名可读，是本仓唯一
      # 免凭证取证面（api logs/artifact 均需 auth）——2026-10-24 rust job 连续
      # 32s 级 fast-fail（保存者自身绿、恢复者必红）取证用；绿跑零输出零成本
      - name: cargo test 失败日志尾部落 summary
        if: failure()
        run: |
          {
            echo '## cargo test 失败尾部（最近 120 行）'
            echo '```'
            tail -n 120 /tmp/cargo-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-prep:
    name: e2e-prep（构建 + 语料 + 生成物 + server 二进制，供分片共享）
    runs-on: ubuntu-latest
    # spec G §7 落定：无 needs——与 web/rust 并行起跑；代价=web 失败时白跑一个
    # runner 的构建成本，知情接受
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 与原单 e2e job 逐字一致的 11 语言输入（缓存键不变=仍命中）；用例资产理由：
      # e2e 高亮断言依赖真实 wasm（m1 js / m2 ts+rs / m3 围栏 ts+bash）；
      # java 供 b-grammar-layers 分层链用例（同源缺失 → CDN 层兜底）的资产来源；
      # yaml 供 t-hl BUG-37 用例（yaml 外置 scanner 修复后需真 yaml wasm）；
      # ocaml 供 b-code-outline OUT-05（无 tags.scm 语言的零大纲锚——须 wasm 在场
      # 走真 parse 路径，缺失会 hljs 兜底使前置锚假红）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust,java,yaml,ocaml
      # wasm-bindgen CLI 供给缓存（同 web job：脚本自供给官方预编译二进制，此处仅承载缓存）
      - uses: actions/cache@v6
        with:
          path: ~/.cache/svgbob/wasm-bindgen-cli
          key: wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('packages/vviewer-render-diagram/tools/svgbob-wasm/Cargo.toml') }}
      # svgbob wasm 引擎产物不入库（spec §7）：web build 前构建期生成（接线形态与
      # web job 一致：dtolnay 装 wasm32 target + Swatinem cargo 缓存 + wasm-opt 沿
      # setup-grammars 缓存的 binaryen，缺则脚本自行降级）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vviewer-render-diagram/tools/svgbob-wasm
      - run: pnpm gen:svgbob-wasm
      # b-grammar-layers 用例要求构建期注入 CDN 层 base（mock CDN，不依赖外网）；
      # 与 spec 内 mock 的路由前缀严格一致（base 同时容纳 manifest.json 与 *.wasm）；
      # env 内联形态与原单 e2e job 逐字一致（CI prep 不走本地 build:e2e 包装，等值）
      - run: pnpm --filter web build
        env:
          VV_GRAMMAR_CDN: https://cdn.grammars.test/grammars/
      # server 二进制预编译（分片内零 Rust 编译，spec G §5 前置共享语义）：grammar
      # 源树全量 1.9GB 不过 artifact——改由 prep 侧一次编译成二进制后下发。编译输入
      # （server/grammars-manifest.json + assets/queries + 11 语言源树）皆在 prep 侧
      # 在位（上方 setup-grammars --fetch 已产出源树），源集/profile 与旧单 e2e job
      # 内「serverHarness 的 cargo build」逐字一致（11 语言 partial 构建，build.rs
      # 语义不变）——故分片零编译即等价于旧单 job 面。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # 与 rust job 的 cache key 分开（rust job 为 15 语言集，e2e-prep 为 11
          # 语言集，target 目录不可混存）；key 仍按 Cargo.lock 哈希失效
          key: rust-e2e-server
      - run: cargo build --manifest-path server/Cargo.toml
      # 多源渲染语料不入库（避免上游许可证问题）：经下载脚本按 SOURCES 表拉取各上游
      # 仓固定 commit 的文件到 apps/web/e2e/fixtures/corpus/<source-id>/（幂等，失败清单记
      # manifest）；github.token 提升 API 限流（匿名 60 → 1000 req/h）
      - run: node tools/fetch-e2e-corpus.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # plan5 pdf-range 域夹具（linearized PDF，corpus 惯例 binary 不入库）：由库内
      # 生成器确定性再生（PEP-723 inline 依赖 pikepdf，uv run 免 --with）；缺失时
      # PDF-RANGE-01/02/03/05/06/07 会 skip（spec existsSync 守卫），此处保证 CI 真跑非 skip
      - uses: astral-sh/setup-uv@v6
      - run: uv run tools/gen-e2e-pdf-linearized.py
      # 产出面自检（与分片侧同一份清单，tools/check-e2e-surfaces.mjs）：prep 侧缺件
      # 即在上传前红——避免把缺件 artifact 发给 4 个分片再各自红。
      - name: 仓库树消费面自检（产出面）
        run: node tools/check-e2e-surfaces.mjs --stage=producer
      # artifact ①：preview 伺服面——kit 3 vite preview 伺服 .svelte-kit/output/{client,server}
      #（adapter 部署产物 build/ 非输入）；wasm/引擎产物已随 client 树（build 期 static/ 拷贝）。
      # include-hidden-files：v4+ 引擎默认排除 dotfiles（output/{client,server}/.vite/manifest.json
      # 为隐藏件）——review 定损 preview 不读 .vite（只读 output/server/manifest.js），仍传保
      # artifact=build 产物完整等值
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-web-build
          path: apps/web/.svelte-kit/output
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      # artifact ②：语料 + PDF 夹具（pdf-linearized 在 corpus 树内一并覆盖）。
      # include-hidden-files 必需：manifest files 清单含 4 条点开头条目
      #（markpad-md/.github/PULL_REQUEST_TEMPLATE.md 与 linguist-samples 的
      # .php/.eslintrc.json/.oxlintrc.json——v4+ 引擎默认排除 dotfiles，漏配即分片
      # runner 语料缺件、LCD/MRP 批量用例假红，违反分片=现单 job 同面承诺）
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-corpus
          path: apps/web/e2e/fixtures/corpus
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      # artifact ③：adapter-static 部署产物（apps/web/build）——「构建产物消费面」：
      # b-sw-runtime-cache 读 sw.js 与 _app/immutable（产物层断言 + 构建期 env 反查）、
      # b-ext-bindings 反查构建期 env 镜像域、m5/m6/b-git-panel 以其作 server --web-dist。
      # plan Review Focus 5 漏盘此类消费面（只盘了 corpus 运行时消费面）→ 分片侧
      # 目录缺失即 ENOENT/404 整域红。build/ 与 .svelte-kit/output/client 内容高度
      # 重叠但语义不同（build/ 是部署产物，含 adapter 的 fallback index.html）。
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-web-static
          path: apps/web/build
          retention-days: 1
          if-no-files-found: error
      # artifact ④：仓库树生成物（「仓库树消费面」）——spec 进程在模块求值期直读的
      # 生成物（spec F 出库不入库）：@bhxch/vviewer-core barrel 的 generated-extensions
      # （9 个 spec 顶层 import）、themes.json（t-theme 顶层 readFileSync）、
      # languages.json（highlight 包 langdetect 静态 JSON import）。
      # 刻意**不下发** server/grammars-manifest.json 与 assets/queries：二者是 cargo
      # build.rs 的编译期输入，分片内不编译 Rust——下发而无 grammar 源树会让误触发的
      # cargo build 静默产出「0 grammar」partial 构建（无声降级），缺件时 build.rs 的
      # panic（显式指向 pnpm gen:sources）才是正确形态。
      - name: 汇集仓库树生成物（分片进程直读面）
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/e2e-repo-tree"
          rm -rf "$stage"
          mkdir -p "$stage/packages/vviewer-core/src/registry" "$stage/packages/vviewer-highlight/assets"
          cp packages/vviewer-core/src/registry/generated-extensions.ts "$stage/packages/vviewer-core/src/registry/"
          cp packages/vviewer-highlight/assets/themes.json "$stage/packages/vviewer-highlight/assets/"
          cp packages/vviewer-highlight/assets/languages.json "$stage/packages/vviewer-highlight/assets/"
          find "$stage" -type f | sort
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-repo-tree
          path: ${{ runner.temp }}/e2e-repo-tree
          retention-days: 1
          if-no-files-found: error
      # artifact ⑤：预编译 server 二进制（分片零 cargo 编译）——grammar 源树 1.9GB
      # 不过 artifact，故 prep 侧编译后下发；分片侧 serverHarness 见
      # VV_SERVER_BIN_PREBUILT=1 即跳过 cargo build 直接 spawn。
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-server-bin
          path: server/target/debug/vviewer
          retention-days: 1
          if-no-files-found: error
      # artifact ⑥：用例清单基线（spec G §5「用例守恒」锚的自动化）——全量与四分片的
      # `--list` 计数在 prep 侧一次采齐，断言 Σ(分片)==全量，分片侧逐项比对。
      # `--list` 会加载全部 spec 文件：任一 spec 模块加载失败（生成物/资产表缺失）
      # 在此步即确定性报错——把「整文件用例集体 error」挡在用例执行之前。
      - name: 采集用例清单基线（全量 + 四分片，断言守恒）
        run: |
          set -euo pipefail
          list_dir="$RUNNER_TEMP/e2e-list"
          mkdir -p "$list_dir"
          export PLAYWRIGHT_BLOB_OUTPUT_DIR="$list_dir/blob-list"
          pnpm --filter web exec playwright test --list > "$list_dir/list-full.txt"
          for s in 1 2 3 4; do
            pnpm --filter web exec playwright test --list --shard=$s/4 > "$list_dir/list-shard-$s.txt"
          done
          node tools/e2e-list-guard.mjs baseline "$list_dir"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-list-baseline
          path: ${{ runner.temp }}/e2e-list/list-baseline.json
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e（Playwright chromium ${{ matrix.shard }}）
    runs-on: ubuntu-latest
    needs: [web, e2e-prep]
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # matrix.shard 值含 '/' 不合法于 artifact name——归一 SHARD_NAME（1/4→1-4）
      - name: 归一分片名（artifact name 合法化）
        run: echo "SHARD_NAME=$(printf '%s' '${{ matrix.shard }}' | tr '/' '-')" >> "$GITHUB_ENV"
      # 分片共享前置产物（分片内零 setup-grammars/零 build/零语料步/零 cargo 编译）：
      # 五类「spec 进程消费面」逐一下发，缺一即整文件用例 error（非断言红）——
      #   ① e2e-web-build  = preview 伺服面（kit 3 vite preview 读 .svelte-kit/output；
      #      wasm/引擎产物已随 client 树下发，build 期 static/ 拷贝）
      #   ② e2e-web-static = adapter-static 部署产物（apps/web/build：产物层断言面 +
      #      构建期 env 反查面 + server --web-dist 面）
      #   ③ e2e-corpus     = 多源渲染语料 + PDF 夹具（spec 进程读相对路径，双侧同
      #      路径保 artifact 根布局约定无关）
      #   ④ e2e-repo-tree  = 仓库树生成物（Node 侧 barrel/资产表，模块求值期直读）
      #   ⑤ e2e-server-bin = 预编译 server 二进制（grammar 源树 1.9GB 不过 artifact，
      #      分片内零 Rust 编译即等价于旧单 e2e job 的 cargo build 面）
      - uses: actions/download-artifact@v8
        with:
          name: e2e-web-build
          path: apps/web/.svelte-kit/output
      - uses: actions/download-artifact@v8
        with:
          name: e2e-web-static
          path: apps/web/build
      - uses: actions/download-artifact@v8
        with:
          name: e2e-corpus
          path: apps/web/e2e/fixtures/corpus
      - uses: actions/download-artifact@v8
        with:
          name: e2e-repo-tree
          path: ${{ github.workspace }}
      - uses: actions/download-artifact@v8
        with:
          name: e2e-server-bin
          path: server/target/debug
      # artifact 打包可能丢 unix mode 位——显式补可执行位（spawn 直依赖）
      - name: server 二进制可执行位
        run: chmod +x server/target/debug/vviewer
      - uses: actions/download-artifact@v8
        with:
          name: e2e-list-baseline
          path: ${{ runner.temp }}/e2e-list
      # 消费面自检（与 prep 侧同一份清单）：缺件即在跑用例前红，而非 190 个用例集体 error
      - name: 仓库树消费面自检（消费面）
        run: node tools/check-e2e-surfaces.mjs --stage=consumer
      # 用例清单守恒（spec G §5 锚的自动化）：`--list` 会加载全部 spec 文件——生成物/
      # 资产表缺失即此步确定性报错；计数与 prep 侧基线逐项比对（--list 模式不启动
      # webServer，playwright listMode 任务表不含 plugin setup——实测 runner 内安全）
      - name: 分片用例清单采集与守恒校验
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BLOB_OUTPUT_DIR="$RUNNER_TEMP/blob-list"
          pnpm --filter web exec playwright test --list --shard=${{ matrix.shard }} > "$RUNNER_TEMP/list-shard.txt"
          node tools/e2e-list-guard.mjs check "$RUNNER_TEMP/list-shard.txt" "$RUNNER_TEMP/e2e-list/list-baseline.json" '${{ matrix.shard }}'
      # Playwright 浏览器缓存（chromium ~150MB，按 lockfile 哈希失效；key 与原单
      # e2e job 逐字一致）——系统级 apt 依赖不过 artifact，--with-deps 每分片必装
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # m6 远程 rg 通道断言依赖 runner 提供 ripgrep（health searchEngine=rg）：新
      # runner 镜像不再预装（2026-10-14 CI 实证降级 grep），显式安装保通道真实——
      # 系统级前置不过 artifact，每分片自装
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      # playwright.config 的 webServer 在 CI 下自行启动 vite preview（CI 环境变量内置），
      # 每 shard 独立实例伺服下载的 .svelte-kit/output（config 零改动）
      # VV_SERVER_BIN_PREBUILT=1：serverHarness 跳过 cargo build 直 spawn 下发的
      # 预编译二进制（分片内零 Rust 编译）
      - run: pnpm --filter web exec playwright test --shard=${{ matrix.shard }}
        env:
          VV_SERVER_BIN_PREBUILT: '1'
      # blob 每 shard always 上传（e2e-report 聚合依赖，失败也传供分诊）；硬失败无
      # blob 时 ignore 防红噪声（T1 实锚：空跑分片亦产合法空 zip）
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ env.SHARD_NAME }}
          path: apps/web/blob-report
          retention-days: 1
          if-no-files-found: ignore
      # 失败用例 trace 取证（config 的 trace: retain-on-failure）：真实 fetch 时序
      # 类缺陷的远程复现证据（网络面板/DOM 快照），本地不落盘仅 CI 收集；名称分片化防覆盖
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ env.SHARD_NAME }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-report:
    name: e2e 报告合并（merge-reports HTML）
    runs-on: ubuntu-latest
    needs: [e2e]
    # spec §3.3「失败也聚合」意图的形式细化：failure 也跑，skipped/cancelled 不跑
    #（always() 在上游 skip/cancel 时仍起跑聚合 job，无 blob 可下载必翻红添噪声）
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 四分片 blob 合流入一目录（pattern + merge-multiple：v4+ 能力，release.yml
      # 已有 download-artifact@v8 先例）
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: apps/web/blob-report
      # cwd=apps/web（--filter exec）——dir 参数相对 cwd；html 输出 env 钉绝对路径
      #（playwright lib/runner/index.js:3684）
      - name: 合并分片 blob 报告为 HTML
        run: pnpm --filter web exec playwright merge-reports --reporter=html blob-report
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/apps/web/playwright-report
      # HTML 报告为失败分诊主载体（比 trace 7 天长）：合并失败也上传已合成面。
      # if-no-files-found: warn（不 error）——合并步失败即无 playwright-report 目录，
      # 用 error 会以「No files were found」二次翻红（与「合并失败也上传已合成面」的
      # 兜底意图相反：兜底不该制造第二个错误）；合并失败的真信号在合并步本身。
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-html-report
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn
