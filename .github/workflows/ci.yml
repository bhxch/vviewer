# 最小 CI（final review A2）：typecheck + vitest + web 构建 + cargo test + E2E。
# grammar wasm 不入库：单测/e2e 前经 composite action 生成最小语言集（tree-sitter-cli
# 自建，免 emcc；工具链/源树/产物三层缓存）。全量门禁触发链：tag → release.yml →
# workflow_call 复用 grammar.yml（I2 后其自身无 push 触发器）。
# E2E 依赖 Playwright 浏览器下载：用 actions/cache 按 lockfile 哈希缓存 ms-playwright 目录。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web（typecheck + 单测 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 版本读 package.json 的 packageManager 字段（pnpm@10）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # highlight 单测用真实 wasm（bash/html/css/javascript/typescript）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust
      - run: pnpm typecheck
      # C 项：生成扩展名物入库（运行时装配依赖）——与 languages.json 失同步即失败，防入库漂移
      - run: node tools/grammar-builder/gen-code-extensions.mjs --check
      - run: pnpm vitest run
      - run: pnpm --filter web build
      # spec §2.6 预算门禁：dist 图表引擎 chunk（diagram-engines-*.js）总量 ≤4MB，
      # 超限即失败——启用集取舍（减引擎回落 kroki）见 spec，门禁先行兜底
      - name: 图表 chunk 预算门禁
        run: node tools/diagram-budget.mjs
      # 第三方声明完整性辅助检查（warning-only，恒 exit 0；新依赖忘登记时在日志可见）
      - run: node tools/check-notices/check-notices.mjs

  rust:
    name: rust（cargo test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build.rs 需要测试涉及语言的 grammar 源（partial 构建即可跑测试）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust,java,go,c,cpp,tsx,yaml,toml
          fetch-only: 'true'
      # --workspace：server/ 为 workspace 根（vviewer + vviewer-storage），
      # 单包默认不含成员 crate 测试
      # clippy 门禁（台账 3-19）：基线清零后 -D warnings 防回升（先于 test 失败即停）
      - run: cargo clippy --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml --workspace

  e2e:
    name: e2e（Playwright chromium）
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright 浏览器缓存（chromium ~150MB，按 lockfile 哈希失效）
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # e2e 高亮断言依赖真实 wasm（m1 js / m2 ts+rs / m3 围栏 ts+bash）；
      # java 供 b-grammar-layers 分层链用例（同源缺失 → CDN 层兜底）的资产来源；
      # yaml 供 t-hl BUG-37 用例（yaml 外置 scanner 修复后需真 yaml wasm）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: javascript,typescript,bash,html,css,json,python,rust,java,yaml
      # b-grammar-layers 用例要求构建期注入 CDN 层 base（mock CDN，不依赖外网）；
      # 与 spec 内 mock 的路由前缀严格一致（base 同时容纳 manifest.json 与 *.wasm）
      - run: pnpm --filter web build
        env:
          VV_GRAMMAR_CDN: https://cdn.grammars.test/grammars/
      # m6 远程 rg 通道断言依赖 runner 提供 ripgrep（health searchEngine=rg）：新
      # runner 镜像不再预装（2026-10-14 CI 实证降级 grep），显式安装保通道真实
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # playwright.config 的 webServer 在 CI 下自行启动 vite preview（CI 环境变量内置）
      - run: pnpm --filter web exec playwright test
      # 失败用例 trace 取证（config 的 trace: retain-on-failure）：真实 fetch 时序
      # 类缺陷的远程复现证据（网络面板/DOM 快照），本地不落盘仅 CI 收集
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
