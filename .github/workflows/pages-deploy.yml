# Pages 部署流水线：纯前端静态站点 → gh-pages 分支。
# 触发：push main 且前端面（web/packages/grammar 构建器/锁文件/本文件）变更，或手动触发；
# 另有 tag ref 触发路径——release 聚合 job 发布成功后 `gh workflow run --ref <tag>`
# 重部署（grammar 资产内容变化后即时生效）。CDN 版本各次部署自行解析 npm latest
# （方案 B：版本是资产内容的属性，与触发 ref 无关；内容零变化时 latest 不动、URL 稳定）。
# 子路径适配：GitHub Pages 项目站点伺服在 /<repo>/ 下，构建注入 VV_BASE_PATH
# （svelte paths.base、PWA manifest start_url/scope、highlight worker 的
# grammars/queries/runtime 资产路径同源取用，见 apps/web/vite.config.ts 的
# sveltekit() 插件参数注释）；
# 仓库本身是 <owner>.github.io 用户站点时 base 置空按根路径部署。
# 部署 action：peaceiris/actions-gh-pages@v4（当前最新主版本）——默认写入
# .nojekyll（SvelteKit 的 _app/ 下划线目录必需，否则 Jekyll 忽略全部产物），
# force_orphan 使 gh-pages 恒为单提交（常见静态站点分支形态，免历史膨胀）。
# 前置：仓库 Settings → Pages → Source 选 gh-pages 分支；Actions 写权限默认
# 允许（contents: write 已在 job 级显式声明）。
name: Pages 部署（gh-pages）

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'tools/grammar-builder/**'
      - 'packages/vviewer-render-diagram/tools/svgbob-wasm/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-grammars/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建纯前端 → 推送 gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-pages 分支推送（peaceiris 经 GITHUB_TOKEN）
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 产物不入库：web 包内置 lite 集 grammar（aliases.json 键，产出 34）构建期生成；
      # 复用 setup-grammars composite action（工具链/源树/产物三层缓存，同 release.yml web job）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: lite
      # svgbob wasm 引擎产物不入库（spec §7）：web build 期 Rolldown 静态解析
      # diagramEngines 的动态 import，产物缺失即 UNRESOLVED_IMPORT 构建失败——
      # 接线形态与 ci.yml web job 逐字一致（dtolnay 装 wasm32 target + wasm-bindgen
      # CLI 缓存 + Swatinem cargo 缓存 + 构建前 gen；wasm-opt 沿 setup-grammars
      # 缓存的 binaryen，缺则脚本自行降级）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: ~/.cache/svgbob/wasm-bindgen-cli
          key: wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('packages/vviewer-render-diagram/tools/svgbob-wasm/Cargo.toml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vviewer-render-diagram/tools/svgbob-wasm
      - run: pnpm gen:svgbob-wasm
      # Pages base：项目站点 /<repo>/；用户站点（<owner>.github.io）按根路径
      - name: 计算 Pages base 路径
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
          fi
      # 第 3 层 CDN base 构建期烙入：子包多基自解析（spec C 拆包）。pages 独立 checkout
      # 无 release outputs 可读——逐包 `npm view <scope>/vviewer-grammars-full-p<i> version`
      # 探测，i 自 1 递增至首个 404（npm view 失败），逐包以各自解析到的版本拼 jsdelivr
      # URL、`|` 分隔（解析器兼容无分隔符单值）。探测上限 8 防漂移死循环：p8 仍可达时显式
      # warn「包数超探测上限，pages 注入面不完整」（预计 5-6 包留余量，超限不得静默缺席）。
      # 全 404（p1 即失败）→ 不注入 env，第 3 层整体缺席而非注入畸形 URL（缺席 warn 语义
      # 保留；子包未首发的全量包旧版本不再注入——jsdelivr 对全量包 150MB 准入 403，注入
      # 即坏层）
      - name: 计算 CDN 资产 base（子包多基 npm 自解析）
        if: vars.NPM_SCOPE != ''
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          BASES=""
          i=1
          while [ "$i" -le 8 ]; do
            V=$(npm view "${NPM_SCOPE}/vviewer-grammars-full-p${i}" version 2>/dev/null || true)
            if [ -z "$V" ]; then break; fi
            BASES="${BASES}${BASES:+|}https://cdn.jsdelivr.net/npm/${NPM_SCOPE}/vviewer-grammars-full-p${i}@${V}/grammars/"
            i=$((i+1))
          done
          if [ "$i" -eq 1 ]; then
            echo "npm 尚无已发布子包，跳过 CDN 注入（第 3 层缺席；子包首发后自动恢复）"
            exit 0
          fi
          if [ "$i" -gt 8 ]; then
            echo "::warning::包数超探测上限（p8 仍可达），pages 注入面不完整——按实际装箱结果上调本步探测上限"
          fi
          echo "VV_GRAMMAR_CDN=${BASES}" >> "$GITHUB_ENV"
          echo "CDN 多基注入（p1..p$((i-1))）：${BASES}"
      - name: 构建前端（注入子路径 base）
        run: pnpm --filter web build
        env:
          VV_BASE_PATH: ${{ steps.base.outputs.path }}
      - name: 推送 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: apps/web/build
          force_orphan: true
          commit_message: 'deploy: pages ${{ github.sha }}'
