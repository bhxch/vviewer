# Grammar self-build 门禁与产物（spec 承诺的 ≥264 语言覆盖路径）：
# --fetch（vendored languages.toml 浅取 pinned rev）→ tree-sitter-cli 全量 self-build
# （免 emcc，工具链自动下载并经 composite action 缓存）→ artifact。
# 门禁语义：workflow_dispatch 手动触发（PR 可选跑，默认不跑——约 290 次浅取 + 全量编译
# 太重）；push tag v* 时必跑，并经 workflow_call 供 release.yml 复用为 release 输入。
# 门禁阈值：manifest 键数 ≥ 264（spec 验收口径），不足即 fail（失败清单随日志输出）。
# 产物不入库：wasm/manifest 仅存在于 artifact（release 的 grammar-wasm.tar.zst 与 web
# 包的 lite 集由各 job 自行生成）。
name: Grammar

on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  self-build:
    name: grammar（fetch + cli self-build + manifest）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-grammars
        with:
          languages: all
      - name: 门禁摘要与 ≥264 断言（fetch/self-build 失败清单入日志）
        run: |
          node -e "
            const fs = require('node:fs');
            const fetchFails = JSON.parse(fs.readFileSync('tools/grammar-builder/out/fetch-failures.json', 'utf8'));
            const buildFails = JSON.parse(fs.readFileSync('tools/grammar-builder/out/failure-list.json', 'utf8'));
            const manifest = JSON.parse(fs.readFileSync('apps/web/static/grammars/manifest.json', 'utf8'));
            const count = Object.keys(manifest.grammars).length;
            console.log('fetch failures:', fetchFails.length);
            console.log('self-build failures:', buildFails.length);
            console.log('manifest entries:', count);
            if (count < 264) { console.error('门禁不通过：manifest 覆盖 < 264（spec 验收口径）'); process.exit(1); }
          "
      - uses: actions/upload-artifact@v7
        with:
          name: grammar-wasm
          path: apps/web/static/grammars/
          if-no-files-found: error
