# Release 流水线（L1）：push tag v* 触发。三路产物聚合发布：
#   grammar：复用 Grammar self-build（workflow_call，产出全量 wasm + manifest）
#   web：pnpm build → dist zip
#   server：cargo build --release（targets：x86_64-unknown-linux-gnu 起步；
#           后续扩平台在下方 server job 注释的 matrix 上展开）
#   publish-npm：grammar-wasm artifact → npm <scope>/vviewer-grammars-full（scope
#           variable 门控、内容哈希去重（contentHash 对比线上 latest——前端-only 变更
#           零发包、已解析版本下发 outputs.version）；scope 未配置则 npm 分发与 CDN
#           env 均不启用；--provenance 签名需 job 级 id-token: write）
# 聚合 job 以 gh CLI 建 GitHub Release 并上传：vviewer 二进制、web dist zip、
# grammar-wasm.tar.zst。发布写权限仅授予聚合 release job（job 级 contents: write）；
# publish-npm 另持 id-token: write（provenance，无内容写权限）；顶层 contents: read
# 兜底，web/server job 级再显式声明 read（grammar 由被调 workflow 自身的
# contents: read 约束）——与实现一一对应，勿只改注释不改权限。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grammar:
    name: grammar wasm（复用 Grammar self-build）
    uses: ./.github/workflows/grammar.yml

  web:
    name: web dist 构建
    runs-on: ubuntu-latest
    # publish-npm scope 未配置时被跳过——needs 里有 skipped job 会级联跳过依赖 job，
    # 故 !cancelled() 保住 web 常跑（CDN 步骤按 outputs.version 自行决定是否注入）
    needs: [publish-npm]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 产物不入库：web 包内置 lite 集（aliases.json 34 键）需构建期生成
      - uses: ./.github/actions/setup-grammars
        with:
          languages: lite
      # 第 3 层 CDN base 构建期烙入：版本取 publish-npm 已解析版本（内容变化 → 新 tag
      # 版本；内容零变化 → 复用线上 latest，CDN URL 稳定）。scope 未配置（publish-npm
      # 跳过、version 输出为空）则不注入 env——第 3 层整体缺席，而非注入畸形 URL
      - name: 计算 CDN 资产 base（publish-npm 产出已解析版本时）
        if: needs['publish-npm'].outputs.version != ''
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
          VERSION: ${{ needs['publish-npm'].outputs.version }}
        run: |
          echo "VV_GRAMMAR_CDN=https://cdn.jsdelivr.net/npm/${NPM_SCOPE}/vviewer-grammars-full@${VERSION}/grammars/" >> "$GITHUB_ENV"
      - run: pnpm --filter web build
      # adapter-static 产物在 apps/web/build；zip 内容平铺（解包即站点根），落仓库根供上传
      - run: zip -qr "$GITHUB_WORKSPACE/vviewer-web-dist.zip" .
        working-directory: apps/web/build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: vviewer-web-dist.zip
          if-no-files-found: error

  server:
    name: server 单二进制（x86_64-unknown-linux-gnu）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 平台扩展预留（matrix 展开即可，每项需对应 runner 与 target）：
    # strategy:
    #   matrix:
    #     include:
    #       - { os: macos-latest, target: aarch64-apple-darwin, artifact: vviewer-macos-aarch64 }
    #       - { os: windows-latest, target: x86_64-pc-windows-msvc, artifact: vviewer-windows-x64.exe }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-grammars
        with:
          languages: all
          fetch-only: 'true'
      - run: cargo build --release --manifest-path server/Cargo.toml --target x86_64-unknown-linux-gnu
      - run: cp server/target/x86_64-unknown-linux-gnu/release/vviewer vviewer-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: vviewer-linux-x86_64
          path: vviewer-linux-x86_64
          if-no-files-found: error

  publish-npm:
    name: npm 资产包发布（grammars-full）
    runs-on: ubuntu-latest
    # scope 未配置（repo variable）则整个包分发未启用：job 跳过，web 侧 CDN env
    # 同门控不注入（三层解析链的第 3 层整体缺席）。npm 发布不经 GitHub 内容写
    # 权限，但 --provenance 供应链签名需要 OIDC（id-token: write）。
    if: vars.NPM_SCOPE != ''
    needs: [grammar]
    permissions:
      contents: read
      id-token: write
    # 版本下发给 web job（CDN env）与 release 触发 pages 的 input：
    # 内容变化 → 新 tag 版本；内容零变化 → 复用线上 latest（CDN URL 稳定、缓存继续命中）
    outputs:
      version: ${{ jobs.publish-npm.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: grammar-wasm
          path: artifacts/grammar-wasm
      # 版本归一与 web job 同法同值（tag v1.2.3 → npm 版本 1.2.3，无 v 前缀）；
      # VV_GRAMMARS_OUT 指向 artifact 解包目录（pack-npm 默认读构建产物路径，本 job 无构建）
      - name: 归一版本号并打包
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VV_NPM_PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VV_NPM_PACKAGE_NAME=${NPM_SCOPE}/vviewer-grammars-full" >> "$GITHUB_ENV"
          echo "VV_NPM_OUT=$GITHUB_WORKSPACE/dist-npm" >> "$GITHUB_ENV"
          echo "VV_GRAMMARS_OUT=$GITHUB_WORKSPACE/artifacts/grammar-wasm" >> "$GITHUB_ENV"
          node tools/grammar-builder/pack-npm.mjs
      - name: 内容去重门（contentHash 对比线上 latest）
        id: gate
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          PKG="${NPM_SCOPE}/vviewer-grammars-full"
          H_NEW=$(node -p "require('$GITHUB_WORKSPACE/dist-npm/package.json').contentHash")
          H_LATEST=$(npm view "$PKG" contentHash 2>/dev/null || true)
          VER_LATEST=$(npm view "$PKG" version 2>/dev/null || true)
          if [ -n "$H_LATEST" ] && [ "$H_NEW" = "$H_LATEST" ]; then
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            echo "version=${VER_LATEST}" >> "$GITHUB_OUTPUT"
            echo "内容未变化（${H_NEW}）：跳过发布，复用已发布版本 ${VER_LATEST}"
          elif npm view "$PKG@$VV_NPM_PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            echo "version=${VV_NPM_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "同版本已存在：跳过发布（tag 重跑）"
          else
            echo "version=${VV_NPM_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "内容变化（${H_NEW} ≠ 线上 ${H_LATEST:-无}）：发布 ${VV_NPM_PACKAGE_VERSION}"
          fi
      - name: npm publish
        if: env.SKIP_PUBLISH != '1'
        # --provenance：npm 供应链签名（公开包 + GitHub Actions + id-token: write），
        # 发布页展示 "Published with provenance"；对齐 aicommit release 实践
        run: npm publish ./dist-npm --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: 聚合发布 GitHub Release
    runs-on: ubuntu-latest
    # publish-npm 入 needs：npm 包发布成功后才值得以 tag ref 重部署 pages（CDN 注入
    # 指向该版本）；publish 失败时 pages 保持上一次部署（可重跑 publish 后重触发）。
    needs: [grammar, web, server, publish-npm]
    # 全工作流唯一写权限点：建 Release + 上传产物（job 级显式覆盖顶层 read 兜底）；
    # actions: write 供 gh workflow run 以 tag ref 触发 pages 部署（CDN 注入生效）
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # grammar 包：全量 wasm + manifest（cli 自建 + vendored 遗留集，见 grammar.yml）
      - run: tar --zstd -cf grammar-wasm.tar.zst -C artifacts/grammar-wasm .
      # 先建 Release 附产物；重跑（release 已存在）时降级为 upload --clobber 覆盖
      - run: |
          tag="${GITHUB_REF_NAME}"
          files=(
            "artifacts/vviewer-linux-x86_64/vviewer-linux-x86_64"
            "artifacts/web-dist/vviewer-web-dist.zip"
            "grammar-wasm.tar.zst"
          )
          gh release create "$tag" --title "vviewer ${tag}" --generate-notes "${files[@]}" \
            || gh release upload "$tag" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # 以 tag ref 重触发 Pages 部署：pages-deploy 自身只有 push main 触发（到不了
      # 新发布的包）——grammar 资产内容变化后即时生效（CDN 版本由 pages 部署自解析
      # npm latest，无需透传）；内容零变化时重部署为等价重建，无害。
      - name: 触发 Pages 部署（发布后即时生效）
        if: needs['publish-npm'].outputs.version != ''
        run: gh workflow run pages-deploy.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
