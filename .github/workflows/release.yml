# Release 流水线（L1）：push tag v* 触发。四路产物聚合发布：
#   grammar：复用 Grammar self-build（workflow_call，产出全量 wasm + manifest）
#   web：pnpm build → dist zip
#   server：cargo build --release（targets：x86_64-unknown-linux-gnu 起步；
#           后续扩平台在下方 server job 注释的 matrix 上展开）
#   desktop：Tauri 薄壳三平台 matrix（linux deb+AppImage / macOS dmg×2 aarch64+
#           x86_64 分产物 / Windows NSIS）——server sidecar per-target 构建复制为
#           externalBin 命名、web job dist 复用为 resources、tauri CLI 打包；未签名
#           直出（Gatekeeper/SmartScreen 注记见 README 桌面端章节）
#   publish-npm：grammar-wasm artifact → npm <scope>/vviewer-grammars-full（scope
#           variable 门控、内容哈希去重（contentHash 对比线上 latest——前端-only 变更
#           零发包、已解析版本下发 outputs.version）；scope 未配置则 npm 分发与 CDN
#           env 均不启用；--provenance 签名需 job 级 id-token: write）
# 聚合 job 以 gh CLI 建 GitHub Release 并上传：vviewer 二进制、web dist zip、
# grammar-wasm.tar.zst。发布写权限仅授予聚合 release job（job 级 contents: write）；
# publish-npm 另持 id-token: write（provenance，无内容写权限）；顶层 contents: read
# 兜底，web/server/desktop job 级再显式声明 read（grammar 由被调 workflow 自身的
# contents: read 约束）——与实现一一对应，勿只改注释不改权限。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grammar:
    name: grammar wasm（复用 Grammar self-build）
    uses: ./.github/workflows/grammar.yml

  web:
    name: web dist 构建
    runs-on: ubuntu-latest
    # publish-npm scope 未配置时被跳过——needs 里有 skipped job 会级联跳过依赖 job，
    # 故 !cancelled() 保住 web 常跑（CDN 步骤按 outputs.version 自行决定是否注入）
    needs: [publish-npm]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 产物不入库：web 包内置 lite 集（aliases.json 键，产出 34）需构建期生成
      - uses: ./.github/actions/setup-grammars
        with:
          languages: lite
      # 第 3 层 CDN base 构建期烙入：版本取 publish-npm 已解析版本（内容变化 → 新 tag
      # 版本；内容零变化 → 复用线上 latest，CDN URL 稳定）。scope 未配置（publish-npm
      # 跳过、version 输出为空）则不注入 env——第 3 层整体缺席，而非注入畸形 URL
      - name: 计算 CDN 资产 base（publish-npm 产出已解析版本时）
        if: needs['publish-npm'].outputs.version != ''
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
          VERSION: ${{ needs['publish-npm'].outputs.version }}
        run: |
          echo "VV_GRAMMAR_CDN=https://cdn.jsdelivr.net/npm/${NPM_SCOPE}/vviewer-grammars-full@${VERSION}/grammars/" >> "$GITHUB_ENV"
      - run: pnpm --filter web build
      # adapter-static 产物在 apps/web/build；zip 内容平铺（解包即站点根），落仓库根供上传
      - run: zip -qr "$GITHUB_WORKSPACE/vviewer-web-dist.zip" .
        working-directory: apps/web/build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: vviewer-web-dist.zip
          if-no-files-found: error

  server:
    name: server 单二进制（x86_64-unknown-linux-gnu）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 平台扩展预留（matrix 展开即可，每项需对应 runner 与 target）：
    # strategy:
    #   matrix:
    #     include:
    #       - { os: macos-latest, target: aarch64-apple-darwin, artifact: vviewer-macos-aarch64 }
    #       - { os: windows-latest, target: x86_64-pc-windows-msvc, artifact: vviewer-windows-x64.exe }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-grammars
        with:
          languages: all
          fetch-only: 'true'
      - run: cargo build --release --manifest-path server/Cargo.toml --target x86_64-unknown-linux-gnu
      - run: cp server/target/x86_64-unknown-linux-gnu/release/vviewer vviewer-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: vviewer-linux-x86_64
          path: vviewer-linux-x86_64
          if-no-files-found: error

  desktop:
    name: 桌面端三平台打包（Tauri 薄壳 + server sidecar）
    runs-on: ${{ matrix.os }}
    # web dist 复用 web job 产物（grammar wasm self-build 全仓只跑一次，spec「依赖
    # 既有 grammar/web 构建链」）；web 以 !cancelled() 常跑，publish-npm 失败不拦
    needs: [web]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb/AppImage 的 glibc 兼容面取受支持最老 LTS（webkit2gtk-4.1 可用）
          - { os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, artifact: linux-x86_64 }
          # macOS 双 arch 分产物 = 双 host 原生编译：server build.rs 手动 g++ 不带
          # -arch，单 runner 交叉编 x86_64 不可行；末代 Intel runner macos-13 已于
          # 2025-12 退役，钉定 macos-15（arm64）+ macos-15-intel（x86_64）
          - { os: macos-15, triple: aarch64-apple-darwin, artifact: macos-aarch64 }
          - { os: macos-15-intel, triple: x86_64-apple-darwin, artifact: macos-x86_64 }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, artifact: windows-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      # 双 workspace：server（sidecar 源）+ 桌面壳（独立 Cargo workspace）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            apps/desktop/src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # server build.rs 按 grammars-manifest.json（301 全集）源码编译 grammar：
      # 源树由 fetch 管线产出（缺源仅 partial 告警不断链，桌面 compute 高亮须全量）
      - uses: ./.github/actions/setup-grammars
        with:
          languages: all
          fetch-only: 'true'
      # server build.rs 以外部命令 g++/ar/objcopy 编链 C++ scanner（yaml/vue 等）。
      # 三平台垫片：linux 预装即用；macOS objcopy 缺席（Xcode 自带 llvm-objcopy，
      # binutils 兜底）；windows 预装 mingw64（g++/ar/objcopy 全）但不在 PATH。
      # 校准点：mingw g++ 对象 × msvc 链接的 C++ 运行时面——CI 首跑验证（spec 实施注记）
      - name: 工具链垫片（server build.rs 的 g++/ar/objcopy 依赖）
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              mkdir -p "$RUNNER_TEMP/shim"
              SRC="$(command -v llvm-objcopy || true)"
              [ -z "$SRC" ] && SRC="$(xcrun -f llvm-objcopy 2>/dev/null || true)"
              if [ -z "$SRC" ]; then
                brew install binutils
                SRC="$(brew --prefix binutils)/bin/objcopy"
              fi
              printf '#!/bin/sh\nexec "%s" "$@"\n' "$SRC" > "$RUNNER_TEMP/shim/objcopy"
              chmod +x "$RUNNER_TEMP/shim/objcopy"
              echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
              ;;
            Windows)
              for d in "/c/ProgramData/mingw64/mingw64/bin" "/c/msys64/mingw64/bin"; do
                [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
              done
              ;;
          esac
      # 前端 dist：web job 产物 zip 内容平铺（解包即站点根），落 apps/web/build
      # （tauri.conf.json resources "../../web/build/" 的源路径）
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: .
      - name: 解包 web dist 到 resources 源路径
        shell: bash
        run: |
          mkdir -p apps/web/build
          case "$RUNNER_OS" in
            Windows)
              powershell.exe -NoProfile -Command \
                "Expand-Archive -Path vviewer-web-dist.zip -DestinationPath apps/web/build -Force"
              ;;
            *)
              unzip -q vviewer-web-dist.zip -d apps/web/build
              ;;
          esac
      - name: 构建 server sidecar（per-target）
        run: cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.triple }}
      - name: 复制 sidecar 为 externalBin 命名（<名>-<target-triple>）
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "server/target/${{ matrix.triple }}/release/vviewer.exe" \
               "apps/desktop/src-tauri/binaries/vviewer-server-${{ matrix.triple }}.exe"
          else
            cp "server/target/${{ matrix.triple }}/release/vviewer" \
               "apps/desktop/src-tauri/binaries/vviewer-server-${{ matrix.triple }}"
          fi
      # 版本烙印：--config JSON 覆盖合并 conf（tag v1.2.3 → 产物文件名 1.2.3，而非
      # conf 静态 0.1.0）；bundle targets 按宿主过滤，未支持目标仅告警跳过
      - name: Tauri 打包（deb+AppImage / dmg / NSIS 按宿主）
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter desktop exec tauri build \
            --target "${{ matrix.triple }}" \
            --config "{\"version\":\"$VERSION\"}"
      - name: 归集安装包（平铺）
        shell: bash
        run: |
          mkdir -p dist
          find "apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle" -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) \
            -exec cp -v {} dist/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish-npm:
    name: npm 资产包发布（grammars-full）
    runs-on: ubuntu-latest
    # scope 未配置（repo variable）则整个包分发未启用：job 跳过，web 侧 CDN env
    # 同门控不注入（三层解析链的第 3 层整体缺席）。发布走 OIDC trusted publishing
    # 免长驻 NPM_TOKEN：id-token: write 供 npm 换短时发布凭据与 provenance 签名，
    # npm 侧须在包页配 Trusted Publisher（bhxch/vviewer/release.yml + 允许 npm publish）。
    if: vars.NPM_SCOPE != ''
    needs: [grammar]
    permissions:
      contents: read
      id-token: write
    # 版本下发给 web job（CDN env）与 release 触发 pages 的 input：
    # 内容变化 → 新 tag 版本；内容零变化 → 复用线上 latest（CDN URL 稳定、缓存继续命中）
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # 不配 registry-url：无 NODE_AUTH_TOKEN 时 .npmrc 空 authToken 会干扰 OIDC 换凭据
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: grammar-wasm
          path: artifacts/grammar-wasm
      # 版本归一与 web job 同法同值（tag v1.2.3 → npm 版本 1.2.3，无 v 前缀）；
      # VV_GRAMMARS_OUT 指向 artifact 解包目录（pack-npm 默认读构建产物路径，本 job 无构建）
      # GITHUB_ENV 仅对后续 step 生效：归一与打包必须分两步，pack-npm 才读得到变量
      - name: 归一版本号
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VV_NPM_PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VV_NPM_PACKAGE_NAME=${NPM_SCOPE}/vviewer-grammars-full" >> "$GITHUB_ENV"
          echo "VV_NPM_OUT=$GITHUB_WORKSPACE/dist-npm" >> "$GITHUB_ENV"
          echo "VV_GRAMMARS_OUT=$GITHUB_WORKSPACE/artifacts/grammar-wasm" >> "$GITHUB_ENV"
      - name: 打包 npm 资产包
        run: node tools/grammar-builder/pack-npm.mjs
      - name: 内容去重门（contentHash 对比线上 latest）
        id: gate
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          PKG="${NPM_SCOPE}/vviewer-grammars-full"
          H_NEW=$(node -p "require('$GITHUB_WORKSPACE/dist-npm/package.json').contentHash")
          H_LATEST=$(npm view "$PKG" contentHash 2>/dev/null || true)
          VER_LATEST=$(npm view "$PKG" version 2>/dev/null || true)
          if [ -n "$H_LATEST" ] && [ "$H_NEW" = "$H_LATEST" ]; then
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            echo "version=${VER_LATEST}" >> "$GITHUB_OUTPUT"
            echo "内容未变化（${H_NEW}）：跳过发布，复用已发布版本 ${VER_LATEST}"
          elif npm view "$PKG@$VV_NPM_PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            echo "version=${VV_NPM_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "同版本已存在：跳过发布（tag 重跑）"
          else
            echo "version=${VV_NPM_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "内容变化（${H_NEW} ≠ 线上 ${H_LATEST:-无}）：发布 ${VV_NPM_PACKAGE_VERSION}"
          fi
      - name: npm publish（OIDC trusted publishing，免长驻 token）
        if: env.SKIP_PUBLISH != '1'
        # OIDC 发布要求 npm CLI ≥ 11.5.1（node 22 自带 10.x，须显式升级）；
        # 凭据由 npm 以 id-token: write 的 OIDC 自动换取，不设 NODE_AUTH_TOKEN。
        # --provenance：供应链签名，发布页展示 "Published with provenance"；
        # npm 侧 Trusted Publisher（bhxch/vviewer/release.yml）须勾选允许 npm publish
        # ——2026-09-03 后新建配置默认仅允许 stage publish，漏勾发布即被拒
        run: |
          npm install -g npm@^11.5.1
          npm --version
          npm publish ./dist-npm --access public --provenance

  release:
    name: 聚合发布 GitHub Release
    runs-on: ubuntu-latest
    # publish-npm 入 needs：npm 包发布成功后才值得以 tag ref 重部署 pages（CDN 注入
    # 指向该版本）；publish 失败时 pages 保持上一次部署（可重跑 publish 后重触发）。
    needs: [grammar, web, server, desktop, publish-npm]
    # 全工作流唯一写权限点：建 Release + 上传产物（job 级显式覆盖顶层 read 兜底）；
    # actions: write 供 gh workflow run 以 tag ref 触发 pages 部署（CDN 注入生效）
    permissions:
      contents: write
      actions: write
    steps:
      # job 只下载 artifact，工作目录无 .git；gh release create --generate-notes
      # 与 gh workflow run 的 repo 归属探测都经 git remote，缺 checkout 即 fatal
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # grammar 包：全量 wasm + manifest（cli 自建 + vendored 遗留集，见 grammar.yml）
      - run: tar --zstd -cf grammar-wasm.tar.zst -C artifacts/grammar-wasm .
      # 先建 Release 附产物；重跑（release 已存在）时降级为 upload --clobber 覆盖。
      # 桌面产物：desktop-* artifact 内已平铺（deb/AppImage/dmg×2/NSIS exe），逐文件并入
      - run: |
          tag="${GITHUB_REF_NAME}"
          files=(
            "artifacts/vviewer-linux-x86_64/vviewer-linux-x86_64"
            "artifacts/web-dist/vviewer-web-dist.zip"
            "grammar-wasm.tar.zst"
          )
          shopt -s nullglob
          for f in artifacts/desktop-*/*; do files+=("$f"); done
          gh release create "$tag" --title "vviewer ${tag}" --generate-notes "${files[@]}" \
            || gh release upload "$tag" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # 以 tag ref 重触发 Pages 部署：pages-deploy 自身只有 push main 触发（到不了
      # 新发布的包）——grammar 资产内容变化后即时生效（CDN 版本由 pages 部署自解析
      # npm latest，无需透传）；内容零变化时重部署为等价重建，无害。
      - name: 触发 Pages 部署（发布后即时生效）
        if: needs['publish-npm'].outputs.version != ''
        run: gh workflow run pages-deploy.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
