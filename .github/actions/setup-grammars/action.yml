# grammar wasm 资产生成（产物不入库，构建期生成）：
#   --fetch（vendored languages.toml 浅取 pinned rev → tools/grammar-builder/out/grammars）
#   → --self-build（tree-sitter-cli 免 emcc 自建，写 apps/web/static/grammars + manifest，
#     运行时 tree-sitter.wasm 一并就位）。
# languages 输入：all = 全量 build-list（Grammar 门禁 / release）；lite = aliases.json 34 键
# （release web 包）；逗号分隔名 = 显式集合（CI 单测/e2e 的最小集）。
# 缓存三层：wasi-sdk/binaryen 工具链（~/.cache/tree-sitter）、浅取源树、生成产物——
# 命中时 self-build 全部 skip(cached)，秒级完成。
name: 'Setup grammar 资产'
description: '浅取 grammar 源并用 tree-sitter-cli 自建 wasm 到 apps/web/static（构建期生成，不入库）'
inputs:
  languages:
    description: '语言选择面：all | lite | 逗号分隔语言名'
    required: false
    default: 'lite'
  fetch-only:
    description: '仅获取源树（服务端构建输入），跳过 wasm self-build'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: 缓存 grammar 工具链/源树/产物
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/tree-sitter
          tools/grammar-builder/out/grammars
          apps/web/static/grammars
          apps/web/static/tree-sitter.wasm
        # key 追加 fetch-only（I2）：fetch-only 产的「无 wasm」缓存与 self-build 缓存
        # 同键互踩——self-build 恢复到空产物缓存后重建再回写同键，双 job 竞争抖动
        key: grammars-${{ runner.os }}-${{ inputs.languages }}-${{ inputs.fetch-only }}-${{ hashFiles('pnpm-lock.yaml', 'tools/grammar-builder/languages.toml', 'tools/grammar-builder/build-list.json') }}
    - name: fetch + self-build
      shell: bash
      run: |
        echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.languages }}" = "all" ]; then
          FETCH_ARGS=""
          BUILD_ARGS="--all"
        elif [ "${{ inputs.languages }}" = "lite" ]; then
          FETCH_ARGS="--lite"
          BUILD_ARGS=""
        else
          FETCH_ARGS="--languages ${{ inputs.languages }}"
          BUILD_ARGS="--languages ${{ inputs.languages }}"
        fi
        node tools/grammar-builder/build.mjs --fetch $FETCH_ARGS
        if [ "${{ inputs.fetch-only }}" = "true" ]; then
          echo "fetch-only: 跳过 wasm self-build"
          exit 0
        fi
        node tools/grammar-builder/build.mjs --self-build $BUILD_ARGS
