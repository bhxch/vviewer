<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- axe document-title（wcag2a）真修：单页查看器无路由级 svelte:head，静态兜底
       标题；下方 head 占位符内若未来注入 title 则以注入序后者胜出，不冲突。
       警示：head/body 占位符字面量全模板各只能出现这一次（真占位符本体）——
       kit 生成运行时模板用字符串 replace 仅替换首次出现（write_server.js），
       注释等任何位置再写一遍即真占位符漏替换：泄漏为页面顶部可见文本，且
       kit 注入的壳 stylesheet 整体落进 HTML 注释被吞（49bc813 曾中招，kit 的
       load_template 只查存在性不查唯一性）。src/app-html.test.ts 执法。 -->
  <title>vviewer</title>
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
  <script>
    // BUG-51 首帧预置：data-theme-mode 此前唯一写入点在 AppShell onMount（JS bundle
    // 执行后），暗色偏好用户每次导航/刷新都先渲染完整亮色首帧（FOUC）。此内联脚本在
    // 首帧前按 localStorage vviewer:settings 的 themeMode 预置属性：取值口径与
    // AppShell（loadSettings 后 dataset.themeMode = settings.themeMode）逐值一致——
    // 键缺失（无快照/解析失败）→ 'system'（defaults 同款）；存在的值 String() 原样
    // 透传（含手改 localStorage 的脏值，避免「预置一值、挂载跳另一值」的反向闪烁）。
    // 三态值由 app.css 的 :root[data-theme-mode=…] 级联消费；无 CSP/nonce 要求
    // （adapter-static 直出）。
    try {
      var s = JSON.parse(localStorage.getItem('vviewer:settings') || '{}');
      document.documentElement.setAttribute(
        'data-theme-mode',
        'themeMode' in s ? String(s.themeMode) : 'system'
      );
    } catch (e) {
      document.documentElement.setAttribute('data-theme-mode', 'system');
    }
  </script>
  %sveltekit.head%</head>
  <body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
